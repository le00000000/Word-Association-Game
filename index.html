<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Association Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="app">
        <div class="question-area">
            <div class="title">
                <h2>Word <span>Association</span><span class="bg-text">Word Association</span></h2>
            </div>
            <div class="status-bar">
                <div class="status">
                    <div class="rank"><h3 id="rank-heading">rank: </h3></div>
                    <div class="level"><h3 id="level-heading">level: </h3></div>
                </div>
                <div class="score">
                    <h3>score: <span id="score-display"></span></h3>
                </div>
            </div>
            <div class="questions" id="question-display"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
